[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanocosmos-fw"
version = "0.1.0"
description = "Anisotropic electron-microscopy super-resolution SFT for NVIDIA Cosmos Framework"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cosmos-framework",
  "h5py",
  "numpy",
  "pyyaml",
  "tifffile",
  "torch",
]

[project.scripts]
nanocosmos-fw-train = "nanocosmos_fw.train:main"
nanocosmos-fw-manifest = "nanocosmos_fw.manifest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nanocosmos_fw"]
